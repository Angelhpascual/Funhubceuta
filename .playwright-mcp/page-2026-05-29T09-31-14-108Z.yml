        - paragraph [ref=e448]: "Fundado en 1956 como Club Atlético de Ceuta, el club adoptó en 2013 el nombre y colores de la histórica AD Ceuta. Con sede en la ciudad autónoma de Ceuta, en el estrecho de Gibraltar, representa a una ciudad única: española en África."
